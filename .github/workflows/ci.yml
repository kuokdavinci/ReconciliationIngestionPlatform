name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected scopes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      ingestion: ${{ steps.scope.outputs.ingestion }}
      topology: ${{ steps.scope.outputs.topology }}
      eval: ${{ steps.scope.outputs.eval }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed scopes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all:
              - '.github/workflows/**'
              - 'docker-compose.yml'
              - 'docker/**'
              - 'Dockerfile*'
              - '.dockerignore'
              - '.env.example'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
            backend:
              - 'src/**'
              - 'dags/**'
              - 'scripts/**'
              - 'cli/**'
              - 'alembic/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
            ingestion:
              - 'src/fetchers/**'
              - 'src/pipeline/**'
              - 'src/application/automation/**'
              - 'src/application/ingestion/**'
              - 'src/application/review/**'
              - 'src/application/reconciliation/**'
              - 'src/domain/ingestion/**'
              - 'src/infrastructure/ingestion/**'
              - 'src/infrastructure/partner_transaction/**'
              - 'src/infrastructure/postgres/**'
              - 'src/infrastructure/fetch_config/**'
              - 'src/infrastructure/mapping/**'
              - 'src/infrastructure/workflows/**'
              - 'src/infrastructure/persistence/**'
              - 'dags/**'
              - 'docker/**'
              - 'scripts/demo/sprint2/**'
              - 'tests/test_ingestion_*.py'
              - 'tests/test_topology_contract.py'
            topology:
              - 'docker-compose.yml'
              - 'Dockerfile*'
              - '.env.example'
              - 'dags/**'
              - 'src/api/automation.py'
              - 'src/application/automation/**'
              - 'src/application/ingestion/**'
              - 'src/application/review/**'
              - 'src/application/reconciliation/**'
              - 'src/application/runtime/**'
              - 'src/domain/**'
              - 'src/config/settings.py'
              - 'src/normalizer/**'
              - 'src/validators/**'
              - 'src/reconciliation/**'
              - 'src/infrastructure/**'
              - 'alembic/**'
              - 'docker/**'
              - 'requirements*.txt'
              - 'scripts/demo/sprint2/**'
              - 'tests/test_topology_contract.py'
            eval:
              - 'src/analysis/**'
              - 'tests/test_analysis_*.py'
              - 'tests/test_sprint1_eval_benchmark.py'
            frontend:
              - 'frontend-next/**'

      - name: Convert scope flags into job outputs
        id: scope
        env:
          MANUAL_OR_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
          ALL_CHANGED: ${{ steps.filter.outputs.all }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          INGESTION_CHANGED: ${{ steps.filter.outputs.ingestion }}
          TOPOLOGY_CHANGED: ${{ steps.filter.outputs.topology }}
          EVAL_CHANGED: ${{ steps.filter.outputs.eval }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          for scope in backend ingestion topology eval frontend; do
            case "$scope" in
              backend) value="$BACKEND_CHANGED" ;;
              ingestion) value="$INGESTION_CHANGED" ;;
              topology) value="$TOPOLOGY_CHANGED" ;;
              eval) value="$EVAL_CHANGED" ;;
              frontend) value="$FRONTEND_CHANGED" ;;
            esac
            if [ "$MANUAL_OR_NIGHTLY" = "true" ] || [ "$ALL_CHANGED" = "true" ]; then
              value=true
            fi
            echo "$scope=$value" >> "$GITHUB_OUTPUT"
          done

  backend:
    name: Backend quality
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-quality.yml

  ingestion:
    name: Ingestion pipeline
    needs: changes
    if: ${{ needs.changes.outputs.ingestion == 'true' }}
    uses: ./.github/workflows/ingestion-pipeline.yml

  topology:
    name: Full topology
    needs: changes
    if: ${{ needs.changes.outputs.topology == 'true' }}
    uses: ./.github/workflows/topology-contract.yml

  eval:
    name: Analysis evaluation
    needs: changes
    if: ${{ needs.changes.outputs.eval == 'true' }}
    uses: ./.github/workflows/eval.yml

  frontend:
    name: Frontend quality
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-ci.yml

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, backend, ingestion, topology, eval, frontend]
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          INGESTION: ${{ needs.ingestion.result }}
          TOPOLOGY: ${{ needs.topology.result }}
          EVAL: ${{ needs.eval.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND_SELECTED: ${{ needs.changes.outputs.backend }}
          INGESTION_SELECTED: ${{ needs.changes.outputs.ingestion }}
          TOPOLOGY_SELECTED: ${{ needs.changes.outputs.topology }}
          EVAL_SELECTED: ${{ needs.changes.outputs.eval }}
          FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "CI scope detection did not pass: $CHANGES"
            exit 1
          fi
          check_scope() {
            selected="$1"
            result="$2"
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "Selected CI scope did not pass: $result"
              exit 1
            fi
          }
          check_scope "$BACKEND_SELECTED" "$BACKEND"
          check_scope "$INGESTION_SELECTED" "$INGESTION"
          check_scope "$TOPOLOGY_SELECTED" "$TOPOLOGY"
          check_scope "$EVAL_SELECTED" "$EVAL"
          check_scope "$FRONTEND_SELECTED" "$FRONTEND"
