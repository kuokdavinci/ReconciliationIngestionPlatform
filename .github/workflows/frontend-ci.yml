name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, build and interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend-next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for Playwright
        run: npm run playwright:install

      - name: Run frontend interaction tests
        # The scheduler-first demo test calls the real API and is run with the backend stack.
        run: npm run test:e2e -- --grep-invert "@requires-backend"

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            frontend-next/playwright-report/
            frontend-next/test-results/
          if-no-files-found: ignore
          retention-days: 14
