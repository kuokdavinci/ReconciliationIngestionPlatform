name: Ingestion Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    name: Ingestion pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reconciliation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint ingestion pipeline
        run: >
          uv run ruff check
          src/fetchers
          src/pipeline
          src/scheduler
          src/services
          src/models/fetch_config.py
          src/models/indexes.py
          scripts/demo/scenarios

      - name: Run ingestion pipeline tests
        run: >
          uv run pytest
          tests/test_indexes.py
          tests/test_ingestion_integration.py
          tests/test_ingestion_pipeline.py
          tests/test_seed_momo_e2e.py
          tests/test_sprint1_eval_benchmark.py
          -v --tb=short
        env:
          AI_API_KEY: "sk-test-fake-key"
