services:
  mongodb:
    image: mongo:7
    container_name: reconciliation-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: reconciliation
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sftp:
    image: atmoz/sftp
    container_name: reconciliation-sftp
    ports:
      - "2222:22"
    command: ${SFTP_USER}:${SFTP_PASS}:::upload
    volumes:
      - ./sftp_data:/home/${SFTP_USER}/upload
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: reconciliation-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: reconciliation-api
    ports:
      - "8000:8000"
    command: uvicorn src.api:create_app --factory --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_MONGODB_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/reconciliation?authSource=admin
    volumes:
      - ./downloads:/app/downloads
      - ./sftp_data:/app/sftp_data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconciliation-scheduler
    command: python run.py --start-scheduler
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_MONGODB_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/reconciliation?authSource=admin
      - SFTP_HOST=sftp
    volumes:
      - ./downloads:/app/downloads
      - ./sftp_data:/app/sftp_data


volumes:
  mongo_data:
    driver: local
