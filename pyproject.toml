[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation-ingestion"
version = "0.1.0"
description = "Configurable reconciliation ingestion platform"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "motor>=3.0",
    "paramiko>=3.5.1,<4.0.0",
    "httpx>=0.28.1",
    "httpx2>=2.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.141.1",
    "starlette>=1.3.1,<1.4.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    "xlsxwriter>=3.2.9",
    "python-calamine>=0.7.0",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.14.0",
    "greenlet>=3.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.9",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: mark test as end-to-end (requires real services)",
    "integration: mark tests requiring a real database or service",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E701"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
