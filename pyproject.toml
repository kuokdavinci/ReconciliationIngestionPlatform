[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliation-ingestion"
version = "0.1.0"
description = "Configurable reconciliation ingestion platform"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "motor>=3.0",
    "python-decouple>=3.8",
    "paramiko>=5.0.0",
    "apscheduler>=3.11.2",
    "httpx>=0.28.1",
    "cryptography>=48.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: mark test as end-to-end (requires real services)",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E701", "F841", "F821", "F401"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
ignore_errors = true
