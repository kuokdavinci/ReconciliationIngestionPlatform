<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdapterService - Reconciliation Engine</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <!-- Left Sidebar Navigation -->
      <aside class="sidebar" aria-label="Primary Navigation">
        <div class="brand">
          <div class="brand-mark">
            <span class="material-symbols-outlined icon-fill">account_balance</span>
          </div>
          <div>
            <strong>AdapterService</strong>
            <span class="brand-subtitle">Institutional Grade</span>
          </div>
        </div>

        <nav id="nav" class="nav-list">
          <!-- Populated by app.js -->
        </nav>

        <div class="sidebar-footer">
          <div class="system-status">
            <span class="status-dot online"></span>
            <span>SYSTEM ONLINE</span>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <div class="workspace">
        <header class="topbar">
          <div class="page-info">
            <h1 id="page-title">Overview</h1>
            <p class="subtitle" id="page-subtitle">Reconciliation Dashboard & Analytics</p>
          </div>
        </header>

        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <!-- Notifications toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
